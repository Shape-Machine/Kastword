name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private recordings, dictated text, credentials, or security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kastword commit
      placeholder: Output of git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Distribution, Plasma version, Wayland/X11, microphone, target application
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell

