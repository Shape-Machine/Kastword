name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    container: archlinux@sha256:3406a568f45d68f0bef35dc80b3eacec8bda59b0292b2e50d5932ba1667f20cf
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git clang gcovr reuse appstream desktop-file-utils
          extra-cmake-modules qt6-base qt6-declarative qt6-multimedia
          kirigami kconfig kcoreaddons kdbusaddons kglobalaccel ki18n
          knotifications kstatusnotifieritem

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build, test, and validate
        run: >-
          make validate install-smoke coverage
          BUILD_TYPE=Debug
          CMAKE_ARGS="-DKASTWORD_ENABLE_COVERAGE=ON -DKASTWORD_FETCH_DEFAULT_MODEL=OFF"

      - name: Upload test coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: build/coverage.xml
          use_oidc: true

  sanitizers:
    runs-on: ubuntu-latest
    container: archlinux@sha256:3406a568f45d68f0bef35dc80b3eacec8bda59b0292b2e50d5932ba1667f20cf
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git clang
          extra-cmake-modules qt6-base qt6-declarative qt6-multimedia
          kirigami kconfig kcoreaddons kdbusaddons kglobalaccel ki18n
          knotifications kstatusnotifieritem

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          make test
          BUILD_DIR=build-sanitizers
          BUILD_TYPE=Debug
          CMAKE_ARGS="-DKASTWORD_ENABLE_SANITIZERS=ON -DKASTWORD_FETCH_DEFAULT_MODEL=OFF"
