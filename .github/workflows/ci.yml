name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git clang gcovr reuse appstream desktop-file-utils
          extra-cmake-modules qt6-base qt6-declarative qt6-multimedia
          kirigami kconfig kcoreaddons kdbusaddons kglobalaccel ki18n
          knotifications kstatusnotifieritem

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DKASTWORD_ENABLE_COVERAGE=ON
          -DKASTWORD_FETCH_DEFAULT_MODEL=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Measure test coverage
        run: gcovr --root . --filter src/ --xml-pretty --output coverage.xml --print-summary

      - name: Upload test coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.xml
          use_oidc: true

      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp

      - name: Validate licenses
        run: reuse lint

      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net data/io.github.shape_machine.Kastword.metainfo.xml
          desktop-file-validate build/io.github.shape_machine.Kastword.desktop

      - name: Validate QML
        run: /usr/lib/qt6/bin/qmllint -I build -I /usr/lib/qt6/qml src/qml/Main.qml
