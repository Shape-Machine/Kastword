name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    container: archlinux@sha256:3406a568f45d68f0bef35dc80b3eacec8bda59b0292b2e50d5932ba1667f20cf
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git clang gcovr reuse appstream desktop-file-utils
          extra-cmake-modules qt6-base qt6-declarative qt6-multimedia
          kirigami kconfig kcoreaddons kdbusaddons kglobalaccel ki18n
          knotifications kstatusnotifieritem

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build, test, and validate
        run: >-
          make validate install-smoke
          BUILD_TYPE=Debug
          CMAKE_ARGS="-DKASTWORD_FETCH_DEFAULT_MODEL=OFF"

      - name: Measure test coverage
        run: >-
          make coverage
          BUILD_DIR=build-coverage
          BUILD_TYPE=Debug
          CMAKE_ARGS="-DKASTWORD_FETCH_DEFAULT_MODEL=OFF"

      - name: Add coverage to job summary
        if: always()
        run: |
          if [ -f build-coverage/coverage/summary.txt ]; then
            {
              echo '## Test coverage'
              echo '```text'
              cat build-coverage/coverage/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: build-coverage/coverage
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-latest
    container: archlinux@sha256:3406a568f45d68f0bef35dc80b3eacec8bda59b0292b2e50d5932ba1667f20cf
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git clang
          extra-cmake-modules qt6-base qt6-declarative qt6-multimedia
          kirigami kconfig kcoreaddons kdbusaddons kglobalaccel ki18n
          knotifications kstatusnotifieritem

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          make test
          BUILD_DIR=build-sanitizers
          BUILD_TYPE=Debug
          CMAKE_ARGS="-DKASTWORD_ENABLE_SANITIZERS=ON -DKASTWORD_FETCH_DEFAULT_MODEL=OFF"
